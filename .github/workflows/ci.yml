name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo:build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converter smoke test
        run: |
          pip install -r converter/requirements.txt 'pillow>=11.3'
          python -c "
          import cv2, numpy as np
          w = cv2.VideoWriter('/tmp/t.mp4', cv2.VideoWriter_fourcc(*'mp4v'), 24, (640, 360))
          for i in range(24): w.write(np.full((360, 640, 3), i * 10, np.uint8))
          w.release()"
          python converter/scrollframes_convert.py /tmp/t.mp4 -o /tmp/out --widths 320,640 --format avif
          python -c "import json;m=json.load(open('/tmp/out/manifest.json'));assert m['version']==2 and len(m['variants'])==2 and m['frameCount']==24, m"
